site_name: TcKit
site_description: AI-assisted development toolchain for TwinCAT 3 PLC engineering
site_url: https://tckit.org
repo_url: https://github.com/georgeturneruk/tckit
repo_name: georgeturneruk/tckit
edit_uri: edit/main/docs/content/

theme:
  name: material
  logo: assets/logo-small.svg
  favicon: assets/logo-small.svg
  palette:
    scheme: tckit
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

docs_dir: content

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Safety stance: getting-started/permissions.md
  - Capabilities:
    - Reader: capabilities/project-reader/overview.md
    - Writer: capabilities/project-writer/overview.md
    - Build & deploy: capabilities/build-runner/overview.md
    - Testing: capabilities/test-runner/overview.md
    - Hardware: capabilities/hardware/overview.md
    - Doc generator:
      - Overview: capabilities/doc-generator/overview.md
      - "Example: TcUnit": capabilities/doc-generator/tcunit-example.md
    - Docs search: capabilities/docs-searcher/overview.md
  - Architecture:
    - Overview: architecture/overview.md
  - Contributing: contributing.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
