site_name: TcKit
site_description: AI-assisted development toolchain for TwinCAT 3 PLC engineering
site_url: https://tckit.org
repo_url: https://github.com/turb5/tckit
repo_name: turb5/tckit
edit_uri: edit/main/docs/content/

theme:
  name: material
  logo: assets/logo-small.svg
  favicon: assets/logo-small.svg
  palette:
    scheme: tckit
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

docs_dir: content

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Docker Setup: getting-started/docker-setup.md
    - Bridge Setup: getting-started/bridge-setup.md
  - Capabilities:
    - ProjectReader:
      - Overview: capabilities/project-reader/overview.md
      - xml_reader: capabilities/project-reader/xml-reader.md
    - ProjectWriter:
      - Overview: capabilities/project-writer/overview.md
      - automation_writer: capabilities/project-writer/automation-writer.md
    - BuildRunner:
      - Overview: capabilities/build-runner/overview.md
      - xae_com_builder: capabilities/build-runner/xae-com-builder.md
    - TestRunner:
      - Overview: capabilities/test-runner/overview.md
      - tcunit_runner: capabilities/test-runner/tcunit-runner.md
    - DocGenerator:
      - Overview: capabilities/doc-generator/overview.md
      - sphinx_generator: capabilities/doc-generator/sphinx-generator.md
    - DocsSearcher:
      - Overview: capabilities/docs-searcher/overview.md
      - beckhoff_infosys: capabilities/docs-searcher/beckhoff-infosys.md
  - Architecture:
    - Overview: architecture/overview.md
  - Contributing: contributing.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
