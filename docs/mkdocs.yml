site_name: TcKit
site_description: AI-assisted development toolchain for TwinCAT 3 PLC engineering
site_url: https://tckit.org
repo_url: https://github.com/turb5/tckit
repo_name: turb5/tckit
edit_uri: edit/main/docs/content/

theme:
  name: material
  logo: assets/logo-small.svg
  favicon: assets/logo-small.svg
  palette:
    scheme: tckit
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

docs_dir: content

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Docker Setup: getting-started/docker-setup.md
    - Bridge Setup: getting-started/bridge-setup.md
  - Architecture:
    - Overview: architecture/overview.md
    - Ports: architecture/ports.md
  - Adapters:
    - xml reader: adapters/xml-reader.md
    - automation writer: adapters/automation-writer.md
    - xae_com builder: adapters/xae-com-builder.md
    - tcunit runner: adapters/tcunit-runner.md
    - sphinx generator: adapters/sphinx-generator.md
    - beckhoff infosys: adapters/beckhoff-infosys.md
  - Contributing: contributing.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
