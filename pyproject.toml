[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tckit"
version = "0.3.0"
description = "AI-assisted development toolchain for TwinCAT 3 PLC engineering"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["twincat", "plc", "mcp", "ai", "beckhoff", "structured-text"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    # Used by html_generator + markdown_generator. These adapters are
    # loaded by default and the build pipeline auto-runs the doc generator
    # on every successful build, so they must be base deps, not extras.
    "jinja2>=3.0",
    "markupsafe>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-beautifulsoup4",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[project.scripts]
tckit = "tckit.cli:main"

[project.urls]
Homepage = "https://github.com/georgeturneruk/tckit"
Documentation = "https://tckit.org"
Repository = "https://github.com/georgeturneruk/tckit"
Issues = "https://github.com/georgeturneruk/tckit/issues"

[tool.hatch.build.targets.wheel]
packages = ["tckit"]
# tckit/templates/config.toml.example is package data used by `tckit init`
# and `tckit init --print`. Hatch picks it up automatically because it lives
# inside the `tckit` package directory.

# The Windows bridge lives at `bridge/` at the repo root so contributors can
# run `.\bridge\Start-Bridge.ps1` directly during dev. For end users on the
# plugin or pip install path it ships as package data under `tckit/_bridge/`,
# from where `tckit bridge install` copies it to `~/.tckit/bridge/`. Tests
# are dev-only and excluded.
[tool.hatch.build.targets.wheel.force-include]
"bridge/Start-Bridge.ps1" = "tckit/_bridge/Start-Bridge.ps1"
"bridge/harness" = "tckit/_bridge/harness"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "TID252"]
ignore = []

# Adapter isolation (adapters may only import from tckit.ports, tckit.utils,
# or stdlib) is enforced by scripts/check-adapter-isolation.py, run in CI.
# Ruff is not the right tool for that check — keep it focused on style/typing.

[tool.ruff.lint.isort]
known-first-party = ["tckit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-m", "not network"]
markers = [
    "network: marks tests that require network access (run with '-m network' to include them)",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
