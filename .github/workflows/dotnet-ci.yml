name: .NET CI

# Build + unit-test TcKit on Linux. Projects target plain net8.0; the COM/UIA-touching trio
# (Automation, Server, Cli) multi-targets net8.0;net8.0-windows so shipped Windows artefacts keep
# the WPF-profile UIA lane (ADR-0014). EnableWindowsTargeting lets the SDK restore the Windows
# reference assemblies (including WPF, for the windows flavour) on a non-Windows host; the test
# project is plain net8.0 so the test host never loads the desktop framework. Live COM/ADS
# validation against a real 4026 is inherently Windows + TwinCAT and stays a separate on-machine
# step, not CI; the xml writer backend (ADR-0017) is exercised here directly.

on:
  push:
    branches: [main, feat/csharp-rewrite]
  pull_request:
    branches: [main]
  # Manual only, and the one thing it adds is the SARIF upload. See the step at the end for why
  # that is not on by default.
  workflow_dispatch:
    inputs:
      upload_sarif:
        description: "Upload the fixture analysis to the Security tab"
        type: boolean
        default: false

# Least privilege by default; the upload step is the only thing that writes anything, and it only
# runs on a manual dispatch that asks for it.
permissions:
  contents: read

jobs:
  dotnet:
    name: Build + unit tests (.NET / Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: dotnet
    env:
      EnableWindowsTargeting: true
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: dotnet/global.json

      - name: Restore
        run: dotnet restore TcKit.sln

      - name: Build
        run: dotnet build TcKit.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TcKit.sln --configuration Release --no-build --verbosity normal

      # Runs the shipped analysis verb over a real fixture, which is both a smoke test of the CLI
      # path (the unit tests exercise the analyser directly, not the exe) and proof that offline
      # analysis works on a Linux runner. Gated at `error` rather than `warning`: these are bench
      # fixtures, which exist to contain bugs, so a stricter gate here would be meaningless. On a
      # real codebase the pattern is `--baseline <file> --fail-on warning`.
      - name: Analyse a fixture (smoke test of the analyse verb)
        run: |
          dotnet run --project src/TcKit.Cli --configuration Release --framework net8.0 --no-build -- \
            analyse ../bench/fixtures/bug-hunting/T3-tckit-utils/T3TckitUtils.sln \
            --severity warning --format text --fail-on error

      # SARIF is the format an external service consumes, so a malformed document fails at upload
      # rather than here, where nobody is watching. Validating it in CI keeps that feedback local.
      # --fail-on none because the gate above already decides the job's fate: a non-zero exit here
      # would stop the workflow before the document was ever checked.
      - name: Analyse a fixture as SARIF and validate it against the 2.1.0 schema
        run: |
          dotnet run --project src/TcKit.Cli --configuration Release --framework net8.0 --no-build -- \
            analyse ../bench/fixtures/bug-hunting/T3-tckit-utils/T3TckitUtils.sln \
            --severity suggestion --format sarif --sarif-base .. --fail-on none > "$RUNNER_TEMP/tckit.sarif"
          python3 -m pip install --quiet check-jsonschema
          python3 -m check_jsonschema \
            --schemafile https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/sarif-2.1/schema/sarif-schema-2.1.0.json \
            "$RUNNER_TEMP/tckit.sarif"

      # Deliberately opt-in, and never on push or pull_request.
      #
      # The only TwinCAT code in this repository is bench fixtures, which exist to contain bugs so
      # the analyser can be measured against them. Uploading on every run would leave this public
      # repository permanently showing a dozen code-scanning alerts that read as "TcKit has
      # problems" rather than "the analyser found what it was built to find", and they could never
      # be resolved, because fixing the fixtures is what destroys them.
      #
      # It stays available on demand because a schema-valid document is not the same as one GitHub
      # accepts: ingest also enforces a result cap and resolves every URI against the checkout, and
      # nothing else here exercises that. Run the workflow manually with `upload_sarif` ticked to
      # prove the whole path, then dismiss the alerts it raises.
      - name: Upload SARIF to code scanning (manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.upload_sarif
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ runner.temp }}/tckit.sarif
          # Namespaces the results, so this never collides with another tool's alerts.
          category: tckit-analysis

      # The xml writer backend's whole point is writes with no XAE (ADR-0017): drive a
      # representative verb sequence through the CLI on Linux against a fixture copy, then read
      # the result back through the reader to prove the round trip.
      - name: XML writer integration (Linux, no XAE)
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          cp -r "${{ github.workspace }}/bench/fixtures/bug-hunting/B1-off-by-one/." "$scratch/"
          cli() { dotnet run --project src/TcKit.Cli --configuration Release --framework net8.0 --no-build -- "$@"; }
          export TCKIT_SOLUTION="$scratch/B1RollingAverage.sln"
          export TCKIT_WRITER=xml
          plc=B1RollingAverage_Plc
          cli add-folder Filters --parent POUs --plc "$plc"
          printf 'FUNCTION_BLOCK FB_Filter\nVAR\n    x : LREAL;\nEND_VAR\nx := x;\n' > "$scratch/fb.st"
          cli add-pou FB_Filter function_block "@$scratch/fb.st" --parent POUs/Filters --plc "$plc"
          cli add-method FB_Filter Step $'METHOD Step : LREAL\nStep := x;' --plc "$plc"
          cli add-variable FB_Filter VAR_INPUT "fGain : LREAL;" --plc "$plc"
          cli update-method-body-patch FB_Filter Step "Step := x;" "Step := x * fGain;" --plc "$plc"
          cli add-dut ST_Cfg $'TYPE ST_Cfg :\nSTRUCT\n    n : INT;\nEND_STRUCT\nEND_TYPE' --plc "$plc"
          cli add-library-placeholder TcUnit TcUnit --distributor www.tcunit.org --plc "$plc"
          cli get-pou-item "$TCKIT_SOLUTION" FB_Filter Step --plc "$plc" | grep -q "x \* fGain" \
            || { echo "patched method body not visible through the reader"; exit 1; }
          cli delete-pou FB_Filter --plc "$plc"
          grep -q "FB_Filter" "$scratch/B1RollingAverage/$plc/$plc.plcproj" \
            && { echo "compile item survived delete-pou"; exit 1; } || true

      - name: Skills drift check (.claude/skills/ vs plugin/skills/)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/sync-skills.py --check
