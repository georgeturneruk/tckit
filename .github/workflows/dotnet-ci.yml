name: .NET CI

# Build + unit-test TcKit on Linux. It works on ubuntu even though every project is
# `net8.0-windows`: nothing here uses the Windows Desktop packs (WPF/WinForms/UI-Automation) — the
# only Windows-bound code is COM + P/Invoke in the Automation adapter, which are compile-anywhere
# externs exercised only behind in-memory fakes. EnableWindowsTargeting lets the SDK restore the
# Windows reference assemblies on a non-Windows host. Live COM/ADS validation against a real 4026 is
# inherently Windows + TwinCAT and stays a separate on-machine step, not CI.

on:
  push:
    branches: [main, feat/csharp-rewrite]
  pull_request:
    branches: [main]

jobs:
  dotnet:
    name: Build + unit tests (.NET / Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    env:
      EnableWindowsTargeting: true
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: dotnet/global.json

      - name: Restore
        run: dotnet restore TcKit.sln

      - name: Build
        run: dotnet build TcKit.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TcKit.sln --configuration Release --no-build --verbosity normal

      # Runs the shipped analysis verb over a real fixture, which is both a smoke test of the CLI
      # path (the unit tests exercise the analyser directly, not the exe) and proof that offline
      # analysis works on a Linux runner. Gated at `error` rather than `warning`: these are bench
      # fixtures, which exist to contain bugs, so a stricter gate here would be meaningless. On a
      # real codebase the pattern is `--baseline <file> --fail-on warning`.
      - name: Analyse a fixture (smoke test of the analyse verb)
        run: |
          dotnet run --project src/TcKit.Cli/TcKit.Cli.csproj --configuration Release --no-build -- \
            analyse ../bench/fixtures/bug-hunting/T3-tckit-utils/T3TckitUtils.sln \
            --severity warning --format text --fail-on error

      - name: Skills drift check (.claude/skills/ vs plugin/skills/)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/sync-skills.py --check
