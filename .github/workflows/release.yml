name: Release

# Publish self-contained, single-file builds of the MCP server and the CLI as
# GitHub Release assets: win-x64 from the net8.0-windows flavour (COM Automation
# Interface + the UIA lane), and linux-x64 from the plain net8.0 flavour (readers,
# ADS, and the xml writer backend; ADR-0017). The plugin launcher downloads the
# asset matching the host when no .NET SDK is present (see plugin/start-server.mjs);
# CI runners fetch the CLI asset and pin a minimum version via `tckit --version`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.4.0). Created from the current commit if it does not exist."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publish self-contained binaries (Windows + Linux)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve tag and version
        id: tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
            $tag = '${{ inputs.tag }}'
          }
          if (-not $tag) { throw "no tag resolved" }
          # Stamp the binaries with the tag's semver; non-semver tags fall back to 0.0.0.
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+(\.\d+){1,3}(-[0-9A-Za-z.-]+)?$') { $version = '0.0.0' }
          "tag=$tag" | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT
          "version=$version" | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT

      - name: Publish self-contained single-file binaries
        shell: pwsh
        env:
          EnableWindowsTargeting: true
        run: |
          $version = "${{ steps.tag.outputs.version }}"
          # Multi-target projects need the framework named per publish: the windows flavour
          # carries the UIA lane, the plain net8.0 flavour is what runs on Linux.
          $lanes = @(
            @{ Project = 'dotnet/src/TcKit.Server/TcKit.Server.csproj'; Rid = 'win-x64';   Tfm = 'net8.0-windows'; Out = 'publish-server-win' },
            @{ Project = 'dotnet/src/TcKit.Cli/TcKit.Cli.csproj';       Rid = 'win-x64';   Tfm = 'net8.0-windows'; Out = 'publish-cli-win' },
            @{ Project = 'dotnet/src/TcKit.Server/TcKit.Server.csproj'; Rid = 'linux-x64'; Tfm = 'net8.0';         Out = 'publish-server-linux' },
            @{ Project = 'dotnet/src/TcKit.Cli/TcKit.Cli.csproj';       Rid = 'linux-x64'; Tfm = 'net8.0';         Out = 'publish-cli-linux' }
          )
          foreach ($lane in $lanes) {
            dotnet publish $lane.Project `
              -c Release -r $lane.Rid -f $lane.Tfm --self-contained true `
              -p:PublishSingleFile=true `
              -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:DebugType=none `
              -p:Version=$version `
              -o $lane.Out --nologo
            if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed: $($lane.Out)" }
          }

      - name: Stage artifacts + checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item publish-server-win/TcKit.Server.exe dist/tckit-server-win-x64.exe
          Copy-Item publish-cli-win/TcKit.Cli.exe dist/tckit-cli-win-x64.exe
          Copy-Item publish-server-linux/TcKit.Server dist/tckit-server-linux-x64
          Copy-Item publish-cli-linux/TcKit.Cli dist/tckit-cli-linux-x64
          foreach ($name in 'tckit-server-win-x64.exe', 'tckit-cli-win-x64.exe',
                            'tckit-server-linux-x64', 'tckit-cli-linux-x64') {
            $hash = (Get-FileHash dist/$name -Algorithm SHA256).Hash.ToLower()
            "$hash  $name" | Out-File -Encoding ascii dist/$name.sha256
            Write-Host "SHA256 ($name): $hash"
          }

      - name: Create or update the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $assets = @(
            'dist/tckit-server-win-x64.exe', 'dist/tckit-server-win-x64.exe.sha256',
            'dist/tckit-cli-win-x64.exe', 'dist/tckit-cli-win-x64.exe.sha256',
            'dist/tckit-server-linux-x64', 'dist/tckit-server-linux-x64.sha256',
            'dist/tckit-cli-linux-x64', 'dist/tckit-cli-linux-x64.sha256'
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title $tag --generate-notes
          }
