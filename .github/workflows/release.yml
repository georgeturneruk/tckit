name: Release

# Publish self-contained, single-file Windows x64 builds of the MCP server and
# the CLI as GitHub Release assets. Both target net8.0-windows and drive the
# COM Automation Interface + ADS, so the release is Windows-x64 only and is
# built on a Windows runner. The plugin launcher downloads the server asset
# when no .NET SDK is present (see plugin/start-server.ps1); CI runners fetch
# the CLI asset and pin a minimum version via `tckit --version`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.4.0). Created from the current commit if it does not exist."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publish self-contained Windows exes
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve tag and version
        id: tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
            $tag = '${{ inputs.tag }}'
          }
          if (-not $tag) { throw "no tag resolved" }
          # Stamp the binaries with the tag's semver; non-semver tags fall back to 0.0.0.
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+(\.\d+){1,3}(-[0-9A-Za-z.-]+)?$') { $version = '0.0.0' }
          "tag=$tag" | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT
          "version=$version" | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT

      - name: Publish self-contained single-file exes
        shell: pwsh
        run: |
          $version = "${{ steps.tag.outputs.version }}"
          dotnet publish dotnet/src/TcKit.Server/TcKit.Server.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none `
            -p:Version=$version `
            -o publish-server --nologo
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish (server) failed" }
          dotnet publish dotnet/src/TcKit.Cli/TcKit.Cli.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none `
            -p:Version=$version `
            -o publish-cli --nologo
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish (cli) failed" }

      - name: Stage artifacts + checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item publish-server/TcKit.Server.exe dist/tckit-server-win-x64.exe
          Copy-Item publish-cli/TcKit.Cli.exe dist/tckit-cli-win-x64.exe
          foreach ($name in 'tckit-server-win-x64.exe', 'tckit-cli-win-x64.exe') {
            $hash = (Get-FileHash dist/$name -Algorithm SHA256).Hash.ToLower()
            "$hash  $name" | Out-File -Encoding ascii dist/$name.sha256
            Write-Host "SHA256 ($name): $hash"
          }

      - name: Create or update the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $assets = @(
            'dist/tckit-server-win-x64.exe', 'dist/tckit-server-win-x64.exe.sha256',
            'dist/tckit-cli-win-x64.exe', 'dist/tckit-cli-win-x64.exe.sha256'
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title $tag --generate-notes
          }
