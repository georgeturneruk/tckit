services:
  docs:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ${DOCS_PLC_PATH:-C:/tckit/tests/fixtures/sample_project}:/project:ro
      - ${DOCS_OUTPUT:-C:/tckit/docs-output}:/docs-output
    ports:
      - "8080:8080"
    environment:
      - PLC_PROJECT_PATH=/project
      - DOCS_OUTPUT_PATH=/docs-output
    command: python /app/docker/generate_docs_entrypoint.py
